# Test, then deploy ui/ + the Python API to Azure Static Web Apps (managed functions).
# Setup (once): see docs/DEPLOYMENT.md. Until the AZURE_STATIC_WEB_APPS_API_TOKEN
# secret exists, the deploy step builds but skips uploading (SKIP_DEPLOY_ON_MISSING_SECRETS).
name: Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches platform.apiRuntime in ui/public/staticwebapp.config.json
          cache: pip
          cache-dependency-path: |
            api/mars-blindspots/requirements.txt
            api/functions/requirements.txt

      - name: Install Python dependencies
        run: pip install -r api/mars-blindspots/requirements.txt -r api/functions/requirements.txt

      - name: Backend tests (science, API, Azure wrapper from a built bundle)
        run: |
          python -m pytest -q api/mars-blindspots
          python -m pytest -q api/functions

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Frontend tests and build
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assemble the API bundle (only runtime code and processed data)
        run: python api/functions/build.py

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ui
          output_location: dist
          api_location: api/functions/dist
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
